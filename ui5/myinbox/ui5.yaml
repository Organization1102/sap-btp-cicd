# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.6" 
metadata:
  name: kupit.flexiblewf.myinbox
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /docservice
            pathPrefix: /
            destination: doc_service_dest
          - path: /bpmworkflowruntime
            pathPrefix: /
            destination: bpmworkflowruntimedest_MB
          - path: /bpmworkflowruntimeodata
            pathPrefix: /
            destination: bpmworkflowruntimeodatadest_MB
          - path: /hana
            pathPrefix: /
            destination: kupit-flexiblewf-cap-srv_MB
          - path: /workdaycpi
            pathPrefix: /
            destination: WORKDAY_CPI_MB
          - path: /user-api
            pathPrefix: /
            destination: ADGroupMembersReadGraph
        debug: true
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: kupit.flexiblewf.myinbox
        ui5Theme: sap_horizon
